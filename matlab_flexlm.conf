## MATLAB FlexLM License Monitoring
## This plugin executes the matlab_flexlm_telegraf.py script to collect
## license server status and usage metrics

[[inputs.exec]]
  ## Command to execute
  commands = ["/usr/local/bin/matlab_flexlm_telegraf.py"]

  ## Timeout for the command to complete
  timeout = "60s"

  ## Data format to consume
  ## The script outputs InfluxDB line protocol format
  data_format = "influx"

  ## Environment variables to pass to the script
  environment = [
    "LMUTIL=/path/to/lmutil",
    "LICENSE_SPEC=27000@license-server.example.com"
  ]

  ## Collection interval (default is global agent interval)
  interval = "60s"

  ## Add tag for this input
  [inputs.exec.tags]
    collector = "matlab_flexlm"
